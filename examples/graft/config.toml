# Graft example configuration: standalone Gitaly with two agents and a policy
# that protects main.
#
# Start with:  gitaly serve /etc/graft/config.toml
#
# The keys follow internal/gitaly/config (config_graft.go for the [graft]
# section) and doc/graft/CONFIGURATION.md. The paths are examples; adjust them
# for your host. internal/graft/e2e loads this file and validates it, so a key
# that the server does not know fails the test suite.

# Directory with the gitaly-hooks and gitaly-ssh binaries that Git calls back
# into. The quickstart builds them here.
bin_dir = "/var/lib/graft/bin"

# Socket Gitaly listens on. graft-cache connects here (or to another tier)
# with --upstream unix:/var/lib/graft/run/gitaly.sock.
socket_path = "/var/lib/graft/run/gitaly.sock"

# Directory for Gitaly's runtime files (sockets, temporary state).
runtime_dir = "/var/lib/graft/run"

# Shared token of the operator: the administrative tools and the verifier use
# it. A Graft server refuses anonymous callers, so it must set a token (or
# configure graft.admin_token). It is not an agent credential: agents sign
# their requests with their own SSH key (see [[graft.agent]]).
[auth]
token = "change-me-shared-token"

# Repository storage. Repositories are created below this path.
[[storage]]
name = "default"
path = "/var/lib/graft/repos"

[graft]
# Run without GitLab. Access checks and hooks are answered from the policy
# below; the GitLab URL and secret are not required.
standalone = true

# The oldest client the external API answers, such as "0.9.0". A client below
# it, and a client that reports no version at all, is refused with
# FailedPrecondition and told to run `graft upgrade` (doc/graft/UPGRADE.md).
# Empty answers every client.
# min_client_version = "0.9.0"

# Agent identities. Every agent is an SSH key pair: the server holds the
# public key, the agent holds the private one and signs every request with it.
# The agent name is the identity of its key, the actor that the changeset log
# records for its updates, and the acting user ID of its requests in
# standalone mode, whatever user ID the client sends. The policy decides on
# the agent that signed the request (see doc/graft/PLAN14.md and
# doc/graft/AGENT-SECURITY.md). The public keys are read at startup.
#
# public_key_file is the path of an OpenSSH public key ("ssh-ed25519 AAAA...").
# public_key takes the key inline instead; the two are mutually exclusive.
[[graft.agent]]
name = "planner"
public_key_file = "/etc/graft/tokens/planner.pub"

[[graft.agent]]
name = "builder"
public_key_file = "/etc/graft/tokens/builder.pub"

# Policy rules are evaluated in order; the first rule whose actor and refs
# both match decides.
#
# 1. The planner may update main.
[[graft.policy]]
actor = "planner"
refs = ["refs/heads/main"]
allow = true

# 2. Nobody else may update main.
[[graft.policy]]
refs = ["refs/heads/main"]
allow = false

# 3. Everything else (feature branches, temporary work branches) is open to
#    every authenticated actor.
[[graft.policy]]
refs = ["refs/heads/**"]
allow = true

[graft.object_service]
max_objects = 1000
chunk_size = 1048576

[graft.changelog]
disabled = false

[graft.derived]
disabled = false
eager = false
